{% load ui %}<a href="{{ i.url }}" class="{% if i.active %}active{% endif %}" data-tip="{{ i.label }}{% if i.badge %} · {{ i.badge.text }}{% endif %}"{% if i.active %} aria-current="page"{% endif %}>{% icon i.icon %}<span>{{ i.label }}</span>{% if i.badge %}<em class="tag{% if i.badge.kind == 'alert' %} alert{% elif i.badge.kind == 'progress' %} live{% endif %}">{{ i.badge.text }}</em>{% if i.badge.kind == 'alert' %}<i class="nav-dot"></i>{% endif %}{% endif %}</a>
