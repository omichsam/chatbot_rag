{% extends "base.html" %}
{% load ui %}
{% block title %}Password changed{% endblock %}
{% block crumb %}Change password{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;margin:6vh auto 0;padding:32px;text-align:center">
  <span class="stat-icon" style="margin:0 auto 16px;background:var(--good-soft);color:var(--good)">{% icon "check" 20 %}</span>
  <h1 style="margin-bottom:6px">Password updated</h1>
  <p class="muted">Your new password is active.</p>
  <a class="btn btn-primary" href="{% url 'chat:index' %}">Back to chat</a>
</div>
{% endblock %}
