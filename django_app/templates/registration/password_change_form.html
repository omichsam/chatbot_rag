{% extends "base.html" %}
{% load ui %}
{% block title %}Change password{% endblock %}
{% block crumb %}Change password{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;margin:6vh auto 0;padding:32px">
  <span class="stat-icon" style="margin-bottom:16px">{% icon "lock" 20 %}</span>
  <h1 style="margin-bottom:6px">Change password</h1>
  <p class="muted">Use at least 8 characters that aren't easy to guess.</p>
  <form method="post" class="form" style="margin-top:20px">
    {% csrf_token %}
    {{ form.as_div }}
    <button class="btn btn-primary btn-block" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
